<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · ForgeLab Studio</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top wrap"><a class="brand" href="/">FORGE<b>LAB</b> STUDIO</a><nav><a href="/apresentacao">Apresentação</a><a href="/venda">Planos</a><a href="/login">Entrar</a></nav></header><main class="formbox"><div class="eyebrow">USER</div><h1 style="font:600 28px 'Space Grotesk'">Entrar na plataforma</h1><p class="muted">Entre com as credenciais criadas pelo administrador ou recebidas após a confirmação do pagamento.</p><form id="user-login-form"><label class="field">E-mail<input type="email" required autocomplete="username" placeholder="voce@exemplo.com"></label><label class="field">Senha<input type="password" required autocomplete="current-password" placeholder="Sua senha"></label><button class="btn primary" type="submit">Continuar</button><p class="muted" id="user-login-message" role="status"></p></form><p class="muted"><a href="/">Voltar ao início</a></p></main><footer class="foot"><div class="wrap">ForgeLab Studio · Dados reais somente · <a href="/">Página inicial</a></div></footer><script>
document.getElementById('user-login-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('user-login-message');m.textContent='Validando acesso…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:f.querySelector('[type=email]').value,password:f.querySelector('[type=password]').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível entrar.');location.href='/painel';}catch(err){m.textContent=err.message||'Falha no login.';}});
</script></body></html>
