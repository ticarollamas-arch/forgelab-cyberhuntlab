<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · ForgeLab Studio</title><link rel="stylesheet" href="/assets/app.css"></head><body class="admin-login-body"><header class="top wrap"><a class="brand" href="/">FORGE<b>LAB</b> STUDIO</a><nav><a href="/">Voltar à apresentação</a></nav></header><main class="formbox"><div class="eyebrow">ACESSO RESTRITO</div><h1 style="font:600 28px 'Space Grotesk'">Administração</h1><p class="muted">Entre com as credenciais administrativas configuradas no ambiente de implantação.</p><form id="admin-login-form"><label class="field">E-mail administrativo<input name="email" type="email" required autocomplete="username"></label><label class="field">Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar no painel</button><p class="muted" id="admin-message" role="status"></p></form></main><footer class="foot admin-login-footer"><div class="wrap">© ForgeLab Studio · CyberHuntLab · Acesso administrativo</div></footer><script>
document.getElementById('admin-login-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;const out=document.getElementById('admin-message');out.textContent='Validando credenciais…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível autenticar.');location.href='/admin';}catch(err){out.textContent=err.message||'Falha no login.';}});
</script></body></html>
